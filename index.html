<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      function setViewportHeight() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      }
      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
      window.addEventListener('orientationchange', setViewportHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setViewportHeight);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Special Gift For You 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pastel: #ffeef4;
      --bg-gradient: linear-gradient(180deg, #ffeef4 0%, #ffdbe7 100%);
      --primary-pink: #ff6584;
      --deep-pink: #e0446b;
      --soft-pink: #fff0f5;
      --card-bg: rgba(255, 255, 255, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-gradient);
      height: calc(var(--vh, 1vh) * 100);
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
      color: #555;
    }

    @supports (height: 100dvh) {
      body { height: 100dvh; }
    }

    .app-container {
      width: 100%;
      max-width: 560px;
      height: calc(var(--vh, 1vh) * 100);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg-gradient);
      margin: 0 auto;
    }

    @supports (height: 100dvh) {
      .app-container { height: 100dvh; }
    }

    @media (min-width: 900px) {
      .app-container { max-width: 640px; }
    }

    @media (max-height: 640px) {
      .top-bar { padding: 8px 16px 4px !important; }
      .gift-icon-wrapper { width: 90px !important; height: 90px !important; margin-bottom: 10px !important; }
      .gift-heading { font-size: 18px !important; }
      .bottom-bar { padding: 8px 16px 14px !important; }
      .choice-item { width: 42px !important; height: 42px !important; }
    }

    canvas#petals {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(10px, 3vh, 16px) clamp(14px, 4vw, 20px) clamp(6px, 2vh, 8px);
      z-index: 10;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 182, 193, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .badge-pill {
      background: rgba(255, 255, 255, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #9c7178;
      border: 1px solid rgba(255, 182, 193, 0.4);
      letter-spacing: 0.5px;
    }

    /* Screen 1: Tap to Unwrap */
    #unwrap-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
      transition: opacity 0.6s ease, transform 0.6s ease;
      background: radial-gradient(circle at center, #fff3f7 0%, #ffe0ec 100%);
    }

    #unwrap-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.08);
    }

    .gift-icon-wrapper {
      position: relative;
      width: clamp(90px, 25vw, 130px);
      height: clamp(90px, 25vw, 130px);
      margin-bottom: clamp(10px, 3vh, 20px);
      animation: gentle-float 3s ease-in-out infinite;
    }

    .gift-glow {
      position: absolute;
      inset: -15px;
      background: radial-gradient(circle, rgba(255, 182, 193, 0.7) 0%, rgba(255, 255, 255, 0) 70%);
      border-radius: 50%;
      animation: pulse-glow 2s infinite ease-in-out;
    }

    .gift-svg {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 10px 18px rgba(255, 105, 135, 0.25));
    }

    .gift-heading {
      font-size: clamp(18px, 5.5vw, 24px);
      font-weight: 800;
      color: #ff477e;
      text-align: center;
      margin-bottom: 10px;
      padding: 0 12px;
    }

    .gift-subtext {
      font-size: 12px;
      font-weight: 800;
      color: #b08d96;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse-text 1.6s infinite ease-in-out;
    }

    .tap-indicator {
      margin-top: 24px;
      width: 28px;
      height: 44px;
      border: 2px solid #ff9ebb;
      border-radius: 16px;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .tap-dot {
      width: 6px;
      height: 6px;
      background: #ff477e;
      border-radius: 50%;
      margin-top: 8px;
      animation: scroll-hint 1.8s infinite ease-in-out;
    }

    /* Stage content */
    .stage-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
    }

    .bouquet-display {
      position: relative;
      width: min(80vw, 320px);
      height: min(44dvh, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .bouquet-display.bloom {
      animation: pop-bouquet 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    .bouquet-svg-container {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 16px 26px rgba(230, 80, 120, 0.24));
    }

    /* Bottom wrapper bar */
    .bottom-bar {
      padding: clamp(8px, 3vh, 12px) clamp(14px, 4vw, 20px) clamp(14px, 5vh, 22px);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 200, 215, 0.5);
      border-radius: 28px 28px 0 0;
      z-index: 10;
    }

    .wrapper-palette-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
      color: #9e7f87;
      text-align: center;
      margin-bottom: 10px;
    }

    .wrapper-choices {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .choice-item {
      width: clamp(44px, 12vw, 54px);
      height: clamp(44px, 12vw, 54px);
      border-radius: 18px;
      background: #fff;
      border: 2.5px solid transparent;
      box-shadow: 0 4px 12px rgba(255, 180, 195, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 6px;
    }

    .choice-item.active {
      border-color: #ff527b;
      transform: translateY(-4px) scale(1.06);
      box-shadow: 0 8px 18px rgba(255, 82, 123, 0.3);
    }

    /* Floating Letter Button */
    .letter-fab {
      position: absolute;
      right: clamp(16px, 4vw, 22px);
      bottom: clamp(80px, 20vh, 100px);
      width: clamp(48px, 12vw, 56px);
      height: clamp(48px, 12vw, 56px);
      border-radius: 50%;
      background: linear-gradient(135deg, #ff477e, #ff6b8b);
      box-shadow: 0 8px 22px rgba(255, 71, 126, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 15;
      animation: pulse-fab 2s infinite ease-in-out;
      border: none;
    }

    .letter-fab:active {
      transform: scale(0.92);
    }

    .unread-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #ff2a5f;
      color: white;
      font-size: 11px;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
    }

    /* Passcode Lock Modal */
    .lock-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(45, 10, 25, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lock-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .lock-card {
      width: 100%;
      max-width: 320px;
      background: #fff8fa;
      border-radius: 28px;
      padding: 26px 22px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.3);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2.5px solid #ffe1ec;
      transform: scale(0.92);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lock-modal-backdrop.open .lock-card {
      transform: scale(1);
    }

    .lock-icon-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #ffe3ee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .lock-title {
      font-size: 18px;
      font-weight: 800;
      color: #e03168;
      margin-bottom: 4px;
      text-align: center;
    }

    .lock-desc {
      font-size: 13px;
      color: #8b6b74;
      text-align: center;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .passcode-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      border: 2px solid #ffccd8;
      background: #fff;
      font-size: 16px;
      color: #4a363d;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 10px;
    }

    .passcode-input:focus {
      border-color: #ff477e;
      box-shadow: 0 0 0 3px rgba(255, 71, 126, 0.2);
    }

    .passcode-btn {
      width: 100%;
      padding: 12px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #ff477e, #ff6b8b);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255, 71, 126, 0.35);
      transition: transform 0.15s ease;
    }

    .passcode-btn:active {
      transform: scale(0.96);
    }

    .error-msg {
      font-size: 12px;
      font-weight: 700;
      color: #e63946;
      margin-top: 8px;
      min-height: 18px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .error-msg.visible {
      opacity: 1;
    }

    .shake {
      animation: shake-anim 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake-anim {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* Confession Letter Modal */
    .letter-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(45, 10, 25, 0.45);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .letter-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .letter-card {
      width: 100%;
      max-width: 360px;
      max-height: 84vh;
      background: #fff8fa;
      border-radius: 26px;
      padding: 24px 20px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      position: relative;
      display: flex;
      flex-direction: column;
      border: 2px solid #ffe1ec;
      transform: translateY(30px) scale(0.95);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .letter-modal-backdrop.open .letter-card {
      transform: translateY(0) scale(1);
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffe3ee;
      border: none;
      color: #d6336c;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .letter-header {
      font-family: 'Caveat', cursive;
      font-size: 26px;
      font-weight: 700;
      color: #e03168;
      margin-bottom: 8px;
      padding-right: 25px;
      line-height: 1.2;
    }

    .letter-scroll-body {
      overflow-y: auto;
      padding-right: 8px;
      margin: 8px 0 12px;
      color: #4a363d;
      font-size: 14.5px;
      line-height: 1.7;
      word-break: break-word;
      white-space: pre-line;
      flex: 1;
      max-height: 55vh;
      font-weight: 500;
    }

    .letter-scroll-body::-webkit-scrollbar {
      width: 5px;
    }

    .letter-scroll-body::-webkit-scrollbar-thumb {
      background: #ffb8cd;
      border-radius: 10px;
    }

    .letter-footer {
      font-family: 'Caveat', cursive;
      font-size: 24px;
      font-weight: 700;
      color: #e03168;
      text-align: right;
      padding-top: 6px;
      border-top: 1px dashed #ffd1e0;
      margin-top: auto;
    }

    .letter-sub-credit {
      text-align: center;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #bfa0a9;
      margin-top: 8px;
    }

    .floating-heart {
      position: absolute;
      pointer-events: none;
      color: #ff477e;
      font-size: 20px;
      z-index: 100;
      animation: float-up-fade 1.2s ease-out forwards;
    }

    @keyframes gentle-float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes scroll-hint {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(14px); opacity: 0; }
    }
    @keyframes pulse-fab {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); box-shadow: 0 12px 28px rgba(255, 71, 126, 0.65); }
    }
    @keyframes pop-bouquet {
      0% { transform: scale(0.4) translateY(60px); opacity: 0; }
      60% { transform: scale(1.06) translateY(-10px); opacity: 1; }
      80% { transform: scale(0.97) translateY(3px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes float-up-fade {
      0% { transform: translateY(0) scale(0.6); opacity: 1; }
      100% { transform: translateY(-80px) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="app-container" id="container">
    <canvas id="petals"></canvas>

    <div class="top-bar">
      <div class="icon-btn" id="home-btn" title="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9c7178" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>

      <div class="badge-pill">A Special Bouquet</div>

      <div class="icon-btn" id="music-btn" title="Toggle Music">
        <svg id="music-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff477e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </div>
    </div>

    <!-- Center Stage: Realistic Bouquet -->
    <div class="stage-content">
      <div class="bouquet-display" id="bouquet-wrapper">
        <svg class="bouquet-svg-container" viewBox="0 0 360 480" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="flShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="rgba(150, 40, 70, 0.22)"/>
            </filter>
            <radialGradient id="sunCenter" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#3d1e03"/>
              <stop offset="70%" stop-color="#5c330a"/>
              <stop offset="100%" stop-color="#874e14"/>
            </radialGradient>
            <linearGradient id="roseRed" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff4d6d"/>
              <stop offset="100%" stop-color="#c9184a"/>
            </linearGradient>
            <linearGradient id="lilyPink" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="70%" stop-color="#ffccd5"/>
              <stop offset="100%" stop-color="#ff758f"/>
            </linearGradient>
          </defs>

          <!-- Back Wrapper Paper -->
          <path id="wrapper-back" d="M85 240 L180 445 L275 240 C315 170, 260 110, 180 110 C100 110, 45 170, 85 240 Z" fill="#ffc2d4" />

          <!-- Background Leaves / Foliage -->
          <g id="foliage">
            <path d="M120 180 Q60 140 70 80 Q105 100 125 155 Z" fill="#7ba87b"/>
            <circle cx="75" cy="95" r="10" fill="#95c795" opacity="0.9"/>
            <circle cx="95" cy="125" r="12" fill="#88bb88" opacity="0.9"/>
            <path d="M240 180 Q300 140 290 80 Q255 100 235 155 Z" fill="#7ba87b"/>
            <circle cx="285" cy="95" r="10" fill="#95c795" opacity="0.9"/>
            <circle cx="265" cy="125" r="12" fill="#88bb88" opacity="0.9"/>
            <path d="M180 140 Q180 50 160 40 Q145 80 168 130 Z" fill="#88bb88"/>
            <path d="M180 140 Q180 50 200 40 Q215 80 192 130 Z" fill="#7ba87b"/>
          </g>

          <!-- Baby's Breath -->
          <g id="babys-breath" fill="#ffffff" opacity="0.95">
            <circle cx="95" cy="85" r="3.5"/><circle cx="105" cy="75" r="3"/><circle cx="115" cy="88" r="4"/>
            <circle cx="255" cy="85" r="3.5"/><circle cx="265" cy="75" r="3"/><circle cx="245" cy="88" r="4"/>
            <circle cx="170" cy="55" r="3.5"/><circle cx="190" cy="55" r="3"/><circle cx="180" cy="45" r="4"/>
          </g>

          <!-- Sunflower -->
          <g transform="translate(130, 125)" filter="url(#flShadow)">
            <g fill="#ffb703" stroke="#fb8500" stroke-width="0.8">
              <ellipse cx="0" cy="-38" rx="7" ry="20"/>
              <ellipse cx="27" cy="-27" rx="7" ry="20" transform="rotate(45, 27, -27)"/>
              <ellipse cx="38" cy="0" rx="7" ry="20" transform="rotate(90, 38, 0)"/>
              <ellipse cx="27" cy="27" rx="7" ry="20" transform="rotate(135, 27, 27)"/>
              <ellipse cx="0" cy="38" rx="7" ry="20"/>
              <ellipse cx="-27" cy="27" rx="7" ry="20" transform="rotate(225, -27, 27)"/>
              <ellipse cx="-38" cy="0" rx="7" ry="20" transform="rotate(270, -38, 0)"/>
              <ellipse cx="-27" cy="-27" rx="7" ry="20" transform="rotate(315, -27, -27)"/>
              <ellipse cx="15" cy="-35" rx="6" ry="18" transform="rotate(22.5, 15, -35)" fill="#ffc300"/>
              <ellipse cx="35" cy="-15" rx="6" ry="18" transform="rotate(67.5, 35, -15)" fill="#ffc300"/>
              <ellipse cx="35" cy="15" rx="6" ry="18" transform="rotate(112.5, 35, 15)" fill="#ffc300"/>
              <ellipse cx="15" cy="35" rx="6" ry="18" transform="rotate(157.5, 15, 35)" fill="#ffc300"/>
              <ellipse cx="-15" cy="35" rx="6" ry="18" transform="rotate(202.5, -15, 35)" fill="#ffc300"/>
              <ellipse cx="-35" cy="15" rx="6" ry="18" transform="rotate(247.5, -35, 15)" fill="#ffc300"/>
              <ellipse cx="-35" cy="-15" rx="6" ry="18" transform="rotate(292.5, -35, -15)" fill="#ffc300"/>
              <ellipse cx="-15" cy="-35" rx="6" ry="18" transform="rotate(337.5, -15, -35)" fill="#ffc300"/>
            </g>
            <circle cx="0" cy="0" r="22" fill="url(#sunCenter)"/>
            <circle cx="0" cy="0" r="17" fill="none" stroke="#e09f3e" stroke-width="2.5" stroke-dasharray="3 3"/>
            <circle cx="0" cy="0" r="10" fill="none" stroke="#d48c28" stroke-width="2" stroke-dasharray="2 2"/>
          </g>

    async function decryptPayload(password) {
      const enc = new TextEncoder();
      function b64ToBuf(b64) {
        return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      }
      try {
        const salt = b64ToBuf(ENC.salt);
        const iv = b64ToBuf(ENC.iv);
        const data = b64ToBuf(ENC.data);
        const keyMaterial = await crypto.subtle.importKey(
          'raw', enc.encode(password.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']
        );
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        return JSON.parse(new TextDecoder().decode(plainBuf));
      } catch (e) {
        return null; // mali ang password
      }
    }

    let isUnlocked = false;
    let audioPlaying = false;

      if (isUnlocked) {
        openModal();
      } else {
        openLockModal();
      }
    }

    function openLockModal() {
      lockModal.classList.add('open');
      passInput.value = '';
      errorMsg.classList.remove('visible');
      setTimeout(() => passInput.focus(), 300);
    }

    function closeLockModal() {
      lockModal.classList.remove('open');
    }

    async function verifyPasscode() {
      const inputVal = passInput.value;
      const payload = await decryptPayload(inputVal);

      if (payload) {
        isUnlocked = true;
        cachedPayload = payload;
        document.getElementById('letter-recipient').innerText = payload.recipient;
        document.getElementById('letter-text').innerText = payload.message;
        document.getElementById('letter-sender').innerText = payload.sender;

        closeLockModal();
        setTimeout(() => {
          openModal();
        }, 200);
      } else {
        errorMsg.classList.add('visible');
        lockCard.classList.add('shake');
        setTimeout(() => lockCard.classList.remove('shake'), 450);
      }
    }

    unlockBtn.addEventListener('click', verifyPasscode);
    passInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verifyPasscode();
    });

    lockModal.addEventListener('click', (e) => {
      if (e.target === lockModal) closeLockModal();
    });

    function openModal() {
      letterModal.classList.add('open');
      burstPetalsFromLetter();
    }

    function closeModal() {
      letterModal.classList.remove('open');
    }

    openLetterBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleLetterRequest();
    });

    closeLetterBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeModal();
    });

    letterModal.addEventListener('click', (e) => {
      if (e.target === letterModal) closeModal();
    });

    homeBtn.addEventListener('click', () => {
      unwrapScreen.classList.remove('hidden');
      bouquetWrapper.classList.remove('bloom');
      unwrapped = false;
      closeModal();
      closeLockModal();
    });

    function playMusic() {
      bgAudio.play().then(() => {
        audioPlaying = true;
        updateMusicIcon(true);
      }).catch(err => {
        console.log("Audio play blocked or bg.mp3 not found yet:", err);
      });
    }

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audioPlaying) {
        bgAudio.pause();
        audioPlaying = false;
        updateMusicIcon(false);
      } else {
        bgAudio.play().then(() => {
          audioPlaying = true;
          updateMusicIcon(true);
        }).catch(e => console.log(e));
      }
    });

    function updateMusicIcon(isPlaying) {
      if (isPlaying) {
        musicBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff477e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>`;
      } else {
        musicBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9c7178" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4h5v4"></path>
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          </svg>`;
      }
    }

    const themes = {
      pink: { back: '#ffc2d4', left: '#ffa8c0', right: '#ff91ad', center: '#ffb3c6', ribbon: '#e03168', knot: '#ff4d73' },
      kraft: { back: '#d4a373', left: '#c68b59', right: '#b07d4b', center: '#dfb288', ribbon: '#8d5b4c', knot: '#6f4538' },
      purple: { back: '#e2cfea', left: '#d3b7e0', right: '#be9bd4', center: '#dfc2ed', ribbon: '#9b5de5', knot: '#7b2cbf' },
      cream: { back: '#faedcd', left: '#f0dfb6', right: '#e6cca0', center: '#fdf0d5', ribbon: '#e07a5f', knot: '#d06043' }
    };

    function changeTheme(themeName, element) {
      document.querySelectorAll('.choice-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');

      const palette = themes[themeName];
      document.getElementById('wrapper-back').setAttribute('fill', palette.back);
      document.getElementById('wrapper-front-left').setAttribute('fill', palette.left);
      document.getElementById('wrapper-front-right').setAttribute('fill', palette.right);
      document.getElementById('wrapper-front-center').setAttribute('fill', palette.center);
      
      const bow = document.getElementById('ribbon-bow');
      bow.querySelectorAll('path').forEach(p => p.setAttribute('fill', palette.ribbon));
      bow.querySelector('circle').setAttribute('fill', palette.knot);

      createFloatingHeart(event.clientX || window.innerWidth/2, event.clientY || window.innerHeight/2);
    }

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.icon-btn, .choice-item, .letter-card, .letter-fab, .lock-card')) return;
      createFloatingHeart(e.clientX, e.clientY);
    });

    function createFloatingHeart(x, y) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      const emojis = ['💖', '🌸', '✨', '🌷', '🌻', '💕'];
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = `${x - 12}px`;
      heart.style.top = `${y - 12}px`;
      heart.style.fontSize = `${Math.floor(Math.random() * 12) + 18}px`;
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 1200);
    }

    function burstConfetti() {
      for (let i = 0; i < 24; i++) {
        setTimeout(() => {
          const rx = window.innerWidth / 2 + (Math.random() * 200 - 100);
          const ry = window.innerHeight / 2 + (Math.random() * 200 - 100);
          createFloatingHeart(rx, ry);
        }, i * 40);
      }
    }

    function burstPetalsFromLetter() {
      const rect = openLetterBtn.getBoundingClientRect();
      for (let i = 0; i < 8; i++) {
        setTimeout(() => {
          createFloatingHeart(rect.x + 20, rect.y + 20);
        }, i * 50);
      }
    }

    const canvas = document.getElementById('petals');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = canvas.parentElement.clientWidth;
    let height = canvas.height = canvas.parentElement.clientHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = canvas.parentElement.clientWidth;
      height = canvas.height = canvas.parentElement.clientHeight;
    });

    const petals = Array.from({ length: 18 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 6 + 4,
      d: Math.random() * 1.5 + 0.5,
      angle: Math.random() * 360,
      angularSpeed: (Math.random() - 0.5) * 1.5,
      color: ['#ffccd5', '#ffb3c6', '#ffc2d4', '#ffe5ec'][Math.floor(Math.random() * 4)]
    }));

    function drawPetals() {
      ctx.clearRect(0, 0, width, height);
      petals.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.angle * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r, p.r * 1.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        p.y += p.d;
        p.x += Math.sin(p.angle * 0.05) * 0.6;
        p.angle += p.angularSpeed;

        if (p.y > height + 20) {
          p.y = -20;
          p.x = Math.random() * width;
        }
      });
      requestAnimationFrame(drawPetals);
    }
    drawPetals();
  </script>
</body>
</html>
